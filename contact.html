<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact | Toha Karim Sujal</title>
  <meta name="description" content="Get in touch with Toha Karim Sujal.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="contact">

<section style="padding-top:90px;padding-bottom:90px">
  <div class="container">
    <div class="sec-title reveal" data-bg="Contact"><h2>Get In <em>Touch</em></h2></div>

    <div class="contact-grid">
      <div class="reveal">
        <h3>Don't be shy!</h3>
        <p>Feel free to get in touch with me. I am always open to discussing new projects, creative ideas or
          opportunities to be part of your visions.</p>

        <div class="c-item"><span class="ico"><i data-icon="mail"></i></span>
          <div><small>Mail me</small><b><a href="mailto:sijalleo123@gmail.com" data-cfg="email">sijalleo123@gmail.com</a></b></div></div>
        <div class="c-item"><span class="ico"><i data-icon="phone"></i></span>
          <div><small>Call me</small><b><a href="tel:+8801744188079" data-cfg="phone">+880 1744 188079</a></b></div></div>
        <div class="c-item"><span class="ico"><i data-icon="pin"></i></span>
          <div><small>Address</small><b data-cfg="address">Bashundhara C Block, Road 7</b></div></div>

        <div class="socials" data-cfg="socials"></div>
      </div>

      <form class="form reveal d1" id="contactForm" autocomplete="on">
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
        <input type="text" name="subject" placeholder="Your subject" required>
        <textarea name="message" placeholder="Your message" required></textarea>
        <button class="btn" type="submit">Send message <span class="circle"><i data-icon="send"></i></span></button>
      </form>
    </div>
  </div>
</section>

<script src="js/icons.js"></script>
<script src="js/main.js"></script>
</body>
</html>
